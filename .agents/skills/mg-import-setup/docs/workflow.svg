<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img"><title>MG 导入对比初始化</title><desc>检查单文件单页面及 Figma 无文件，导出并导入 MG 与 ZIP，完成后询问是否添加原生图片基准。Gate 失败停止，图片仅在用户选择后执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#223344;text-anchor:middle}.title{font-size:30px;font-weight:700}.label{font-size:18px;font-weight:600}.note{font-size:14px}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}</style><path fill="#f7f9fb" d="M0 0H1200V1190H0Z"/><text class="title" x="600" y="48">MG 导入对比初始化</text><rect x="360" y="80" width="480" height="75" rx="14" fill="#ffffff" stroke="#9eacb8" stroke-width="2"/><text class="label" x="600.0" y="110">读取当前应用状态</text><text class="note" x="600.0" y="135">MasterGo 单文件、单 Page；Figma 未打开文件</text><path class="edge" d="M600 155V180"/><path d="M600 180L790 245L600 310L410 245Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="label" x="600" y="251">起始 Gate 通过？</text><path class="edge" d="M790 245H875"/><text class="note" x="832" y="195">否 / 无法核实</text><rect x="875" y="208" width="285" height="75" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text class="label" x="1017.5" y="238">停止，说明不满足项</text><text class="note" x="1017.5" y="263">用户调整后重新检查</text><path class="edge" d="M600 310V345"/><text class="note" x="623" y="332">是</text><rect x="360" y="345" width="480" height="75" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="label" x="600.0" y="375">原生保存 MG，插件导出所有 Page</text><text class="note" x="600.0" y="400">成对资产保存到 Downloads</text><path class="edge" d="M600 420V455"/><rect x="360" y="455" width="480" height="75" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="label" x="600.0" y="485">新建 Figma 文件，分别导入</text><text class="note" x="600.0" y="510">文件与 MG 同名；命名两页并关闭插件</text><path class="edge" d="M600 530V565"/><rect x="360" y="565" width="480" height="75" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/><text class="label" x="600.0" y="595">交付两页与资产，停止操作</text><text class="note" x="600.0" y="620">询问用户是否需要图片基准</text><path class="edge" d="M600 640V670"/><path d="M600 670L790 735L600 800L410 735Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="label" x="600" y="741">用户选择图片？</text><path class="edge" d="M790 735H875"/><text class="note" x="825" y="720">否</text><rect x="875" y="698" width="285" height="75" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/><text class="label" x="1017.5" y="728">完成两页初始化</text><path class="edge" d="M410 735H285"/><text class="note" x="348" y="720">未答复</text><rect x="40" y="698" width="245" height="75" rx="14" fill="#ffffff" stroke="#9eacb8" stroke-width="2"/><text class="label" x="162.5" y="728">等待用户选择</text><path class="edge" d="M600 800V835"/><text class="note" x="659" y="822">是 / 已授权</text><rect x="360" y="835" width="480" height="75" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="label" x="600" y="865">复制对比页，逐层复制图片并替换粘贴</text><text class="note" x="600" y="890">仅修改 _image 副本；先验证一个根图层</text><path class="edge" d="M600 910V935"/><path d="M600 935L790 995L600 1055L410 995Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="label" x="600" y="1001">快捷路径可用？</text><path class="edge" d="M790 995H875"/><text class="note" x="829" y="981">否</text><rect x="875" y="958" width="285" height="75" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="label" x="1017" y="988">原生导出 PNG 后导入</text><text class="note" x="1017" y="1013">仅处理剩余根图层</text><path class="edge" d="M600 1055V1100"/><text class="note" x="622" y="1080">是</text><path class="edge" d="M1017 1033V1135H840"/><rect x="360" y="1100" width="480" height="75" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/><text class="label" x="600" y="1130">核对三页几何与图片，交付结果</text><text class="note" x="600" y="1155">保留原比较页；披露未完成项与差异</text></svg>