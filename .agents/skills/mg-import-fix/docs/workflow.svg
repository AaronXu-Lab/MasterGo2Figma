<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img"><title>MG 新测试集处理</title><desc>从 MG 文件开始，经单 Page 用户 Gate 自动准备三页，核验仅缺字体时可提前结束，否则循环修复并最终确认效果；获准的导出端修复完成自动化检查与构建后交用户手动测试；任意阶段用户明确结束则记录未验证项并停止，不视为全部验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52606d"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#233343;text-anchor:middle}.title{font-size:30px;font-weight:700}.node{font-size:18px;font-weight:600}.small{font-size:14px}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#arrow)}</style><path fill="#f7f9fb" d="M0 0H1200V1520H0Z"/><text class="title" x="600" y="48">MG 新测试集处理</text><rect x="400" y="80" width="400" height="70" rx="14" fill="#fff" stroke="#9eacb8" stroke-width="2"/><text class="node" x="600.0" y="109">从一个 .mg 文件开始</text><text class="small" x="600.0" y="132">先建批次日志，再导入并等待加载</text><path d="M600 185 L780 240 L600 295 L420 240Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="node" x="600" y="246">完整文件只有一个 Page？</text><path class="edge" d="M600 150V185"/><rect x="865" y="205" width="290" height="70" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/><text class="node" x="1010.0" y="234">等待用户处理</text><text class="small" x="1010.0" y="257">重新核验后继续</text><path class="edge" d="M780 240H865"/><text class="small" x="825" y="228">多 Page</text><path class="edge" d="M1010 205V170H600V185"/><rect x="400" y="330" width="400" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="600.0" y="359">保存同一快照的 MG 与 ZIP</text><text class="small" x="600.0" y="382">Downloads / 测试集 MMDD；重名加序号</text><path class="edge" d="M600 295V330"/><text class="small" x="625" y="319">是</text><rect x="400" y="435" width="400" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="600.0" y="464">新建 Figma 文件并准备三页</text><text class="small" x="600.0" y="487">原生 PNG 落盘 → ZIP 副本逐层替换</text><path class="edge" d="M600 400V435"/><rect x="400" y="540" width="400" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="600.0" y="569">核验图片后关闭 MasterGo</text><text class="small" x="600.0" y="592">按需补边界证据；覆盖与几何分别核验</text><path class="edge" d="M600 505V540"/><path class="edge" d="M600 610V645"/>
<path d="M600 645 L780 700 L600 755 L420 700Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/>
<text class="node" x="600" y="695">两种导入对照 image</text><text class="small" x="600" y="718">仅有已核实的缺失字体文本差异？</text>
<path class="edge" d="M780 700H865"/><text class="small" x="820" y="688">是</text>
<rect x="865" y="665" width="290" height="70" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/>
<text class="node" x="1010" y="694">记录字体例外，提前结束</text><text class="small" x="1010" y="717">保留三页与证据，无需另等验收</text>
<path class="edge" d="M600 755V815"/><text class="small" x="680" y="787">否 / 原因待查</text>
<rect x="35" y="435" width="290" height="70" rx="14" fill="#fff0ef" stroke="#c94b43" stroke-width="2"/>
<text class="node" x="180" y="464">任意阶段：用户明确结束</text><text class="small" x="180" y="487">停止修复与桌面测试，不再询问确认</text>
<path class="edge" d="M180 505V540"/>
<rect x="35" y="540" width="290" height="70" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/>
<text class="node" x="180" y="569">更新状态并交付</text><text class="small" x="180" y="592">保留未验证项与测试责任</text>
<g transform="translate(0 170)"><rect x="400" y="645" width="400" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="600.0" y="674">修复接收端并回归验证</text><text class="small" x="600.0" y="697">构建 → 重导入 MG / ZIP → 对比 image</text><rect x="35" y="645" width="290" height="70" rx="14" fill="#fff" stroke="#9eacb8" stroke-width="2"/><text class="node" x="180.0" y="674">暂存导出端优化候选</text><text class="small" x="180.0" y="697">记录证据与建议，先不修改</text><path class="edge" d="M400 680H325"/><text class="small" x="350" y="632">发现导出缺口</text><path d="M600 750 L780 805 L600 860 L420 805Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="node" x="600" y="811">可修差异已解决？</text><path class="edge" d="M600 715V750"/><path class="edge" d="M420 805H355V700H400"/><text class="small" x="377" y="793">否</text><rect x="400" y="900" width="400" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="600.0" y="929">请用户验收效果</text><text class="small" x="600.0" y="952">交付页面、对比、文字例外与残差</text><path class="edge" d="M600 860V900"/><text class="small" x="718" y="884">是 / 仅剩已披露导出缺口</text><path class="edge" d="M800 935H830V680H800"/><text class="small" x="898" y="846">效果不通过</text><path d="M600 1005 L780 1060 L600 1115 L420 1060Z" fill="#fff7e6" stroke="#c98312" stroke-width="2"/><text class="node" x="600" y="1066">批准导出端候选？</text><path class="edge" d="M600 970V1005"/><path class="edge" d="M180 715V1060H420"/><rect x="865" y="1025" width="290" height="70" rx="14" fill="#edf6ff" stroke="#287bbb" stroke-width="2"/><text class="node" x="1010.0" y="1054">修复导出端并构建检查</text><text class="small" x="1010.0" y="1077">待用户手测；现有画布未验证新导出</text><path class="edge" d="M780 1060H865"/><text class="small" x="825" y="1047">是</text><path class="edge" d="M1010 1025V935H800"/><text class="small" x="1072" y="983">收到用户测试反馈</text><rect x="400" y="1180" width="400" height="70" rx="14" fill="#edf9f1" stroke="#2e8b54" stroke-width="2"/><text class="node" x="600.0" y="1209">用户确认后完成</text><text class="small" x="600.0" y="1232">保留最终页；延期项明确记录</text><path class="edge" d="M600 1115V1180"/><text class="small" x="755" y="1153">无候选 / 暂不做，且效果已接受</text><text class="small" x="600" y="1305">桌面异常先唤起前台并核验重试；仍阻塞则保留进度与未完成项。</text></g></svg>
